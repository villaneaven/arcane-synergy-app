name: Frontend tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: frontend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and Vitest
    runs-on: ubuntu-latest
    permissions:
      contents: read # This is required for actions/checkout

    defaults:
      run:
        working-directory: arcane-synergy-app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: arcane-synergy-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test
