# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - kcpsynergy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: "24.x"

      - name: npm install, build, and test
        working-directory: arcane-synergy-app
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present
        env:
          AZURE_AD_CLIENT_ID: "placeholder-build-value"
          AZURE_AD_CLIENT_SECRET: "placeholder-build-value"
          AZURE_AD_TENANT_ID: "placeholder-build-value"
          AZURE_AD_API_SCOPE: "placeholder-build-value"
          AZURE_AD_API_ID_URI: "placeholder-build-value"
          NEXTAUTH_SECRET: "placeholder-build-value"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: arcane-synergy-app

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_239218357C5D4C30A0331885EABCA76C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_32B71B8AC31E47088BDB9F07EDC2AF3E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6A8B89D2DB5543688BA52990A6B0D173 }}

      - name: "Deploy to Azure Web App"
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "kcpsynergy"
          slot-name: "Production"
          startup-command: "npm install --omit=dev --no-audit --no-fund && npm start"
          package: .
